# SecureVision 2026 - Phase 1 reverse proxy
# HTTP only, dev/docker-compose scope. TLS termination (443, per PLAN.md's
# architecture diagram) is a production-deployment concern, deliberately not
# implemented here - do not treat this file as production-ready as-is.

server {
    listen 80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
