services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Deliberately no `ports:` mapping - PLAN.md's risk register requires the
    # Celery broker to be unreachable from outside the Docker network.

  django:
    build: ./backend_django
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: threatcompass.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_frameworks &&
             gunicorn threatcompass.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static-files:/app/staticfiles
    ports:
      - "8000:8000"

  celery-worker:
    build: ./backend_django
    depends_on:
      - django
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: threatcompass.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["celery", "-A", "threatcompass", "worker", "--loglevel=INFO"]

  celery-beat:
    build: ./backend_django
    depends_on:
      - django
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: threatcompass.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["celery", "-A", "threatcompass", "beat", "--loglevel=INFO"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-files:/app/staticfiles:ro

volumes:
  postgres-data:
  static-files:
