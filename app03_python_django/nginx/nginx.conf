# ThreatCompass 2026 - Phase 1 reverse proxy
# HTTP only, dev/docker-compose scope. TLS termination (443, per PLAN.md's
# architecture diagram) is a production-deployment concern, deliberately not
# implemented here - do not treat this file as production-ready as-is.

server {
    listen 80;
    server_name _;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
