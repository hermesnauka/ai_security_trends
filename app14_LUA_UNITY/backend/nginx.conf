worker_processes auto;
error_log /dev/stderr info;

env JWT_SECRET;
env DB_HOST;
env DB_PORT;
env DB_USER;
env DB_PASSWORD;
env DB_NAME;
env LAPIS_ENVIRONMENT;

events {
  worker_connections 1024;
}

http {
  lua_package_path "./?.lua;./?/init.lua;;";

  # SR-05: shared-dict-backed counter for the login rate limiter
  # (app/services/rate_limiter.lua); 10m is generous headroom for the
  # seeded dataset's realistic traffic.
  lua_shared_dict rate_limit_login 10m;

  init_by_lua_block {
    require("lapis").serve("app")
  }

  server {
    listen 9292;

    location / {
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }
  }
}
