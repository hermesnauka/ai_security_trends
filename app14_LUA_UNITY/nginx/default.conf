server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:9292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:9292;
    }

    # Unity WebGL build output — served as static files, no client-side
    # History-API routing to fall back for (Unity's own WebGL loader owns
    # the single index.html entry point; there is no deep-linkable route
    # structure the way a browser SPA has).
    location / {
        try_files $uri $uri/ =404;
    }
}
