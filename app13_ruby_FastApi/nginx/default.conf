server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:9292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:9292;
    }

    # Client-side History-API routing (router.js) — any non-file path falls
    # back to index.html so a deep link like /threats/A03:2021 works on a
    # hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
