# ScalaShield 2026 - Phase 1 reverse proxy
# HTTP only, dev/docker-compose scope. TLS termination (443, per PLAN.md's
# architecture diagram) is a production-deployment concern, deliberately not
# implemented here - do not treat this file as production-ready as-is.
#
# No /swagger-ui/ or /v3/api-docs/ proxy here (unlike the Java sibling apps) -
# PLAN.md's Tapir + Swagger UI is Phase 1 tech-stack scope this build didn't
# reach; plain zio-http routes only. Add it back if/when Tapir lands.

server {
    listen 80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
